<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swordcraft</title>
<meta name="description" content="Swordcraft — a peer-to-peer real-time strategy game for 2 to 4 players, built in vanilla JavaScript.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="world" hidden></canvas>

<div id="hud" hidden></div>

<div id="menu"></div>

<div id="loading">
  <div class="load-card">
    <h1 class="game-title">Swordcraft</h1>
    <div class="load-bar"><div class="load-fill"></div></div>
    <div class="load-text">Loading assets…</div>
  </div>
</div>

<!-- PeerJS provides WebRTC signalling and the data channel between players. -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
